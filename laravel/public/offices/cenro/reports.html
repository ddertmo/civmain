<!DOCTYPE html>
<html lang="en">
<script>
    (function() {
        var role = localStorage.getItem('cw_role');
        if (!role) {
            window.location.replace('../../index.html');
        } else if (role !== 'cenro') {
            window.location.replace(role === 'super_admin' ? '../../dashboard.html' : '../ceo/dashboard.html');
        }
    })();
</script>

<head>
    <!-- cw-theme-early: apply the saved theme before first paint (no light flash). Same key as App.loadTheme in js/app.js. -->
    <script>try{if(localStorage.getItem('theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Assigned Reports — CENRO</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="/css/variables.css" />
    <link rel="stylesheet" href="/css/global.css" />
    <link rel="stylesheet" href="/css/layout.css" />
    <link rel="stylesheet" href="/css/sidebar.css" />
    <link rel="stylesheet" href="/css/navbar.css" />
    <link rel="stylesheet" href="/css/cards.css" />
    <link rel="stylesheet" href="/css/buttons.css" />
    <link rel="stylesheet" href="/css/tables.css" />
    <link rel="stylesheet" href="/css/badges.css" />
    <link rel="stylesheet" href="/css/forms.css" />
    <link rel="stylesheet" href="/css/responsive.css" />
    <style>
        .table-photo {
            width: 48px;
            height: 38px;
            border-radius: var(--radius-sm);
            object-fit: cover;
            background: var(--gray-100);
            flex-shrink: 0;
        }

        .priority-badge {
            display: inline-flex;
            align-items: center;
            padding: 3px 10px;
            border-radius: var(--radius-full);
            font-size: 11px;
            font-weight: 600;
        }

        .priority-badge.high {
            background: #FEE2E2;
            color: #DC2626;
        }

        .priority-badge.medium {
            background: #FEF3C7;
            color: #D97706;
        }

        .priority-badge.low {
            background: #ECFDF5;
            color: #059669;
        }

        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }

        .modal-backdrop.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal-dialog {
            position: fixed;
            inset: 0;
            z-index: 1001;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .modal-dialog.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal-dialog .modal-box {
            width: 100%;
            max-width: 460px;
        }
    </style>
</head>

<body data-page="reports">
    <div class="app-wrapper">
        <aside class="sidebar" id="sidebar"></aside>
        <div class="main-area" id="mainArea">
            <nav class="navbar" id="navbar"></nav>
            <main class="page-content">

                <div class="page-header">
                    <div>
                        <h1 class="page-title">My Assigned Reports</h1>
                        <p class="page-subtitle">Environmental reports assigned to CENRO.</p>
                    </div>
                </div>

                <div class="table-toolbar">
                    <div class="search-input-wrap">
                        <span class="material-symbols-outlined">search</span>
                        <input type="text" class="search-input" id="searchInput" placeholder="Search reports..." />
                    </div>
                    <select class="filter-select" id="statusFilter">
                        <option value="">All Status</option>
                        <option value="Assigned">Assigned</option>
                        <option value="In Progress">In Progress</option>
                        <option value="Resolved">Resolved</option>
                    </select>
                    <select class="filter-select" id="priorityFilter">
                        <option value="">All Priority</option>
                        <option value="High">High</option>
                        <option value="Medium">Medium</option>
                        <option value="Low">Low</option>
                    </select>
                </div>

                <div class="card">
                    <div class="table-container" style="border:none;">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>PHOTO</th>
                                    <th>REFERENCE NO.</th>
                                    <th>ISSUE</th>
                                    <th>BARANGAY</th>
                                    <th>PRIORITY</th>
                                    <th>STATUS</th>
                                    <th>DATE ASSIGNED</th>
                                    <th>ACTIONS</th>
                                </tr>
                            </thead>
                            <tbody id="reportsBody"></tbody>
                        </table>
                    </div>
                    <div class="table-footer">
                        <span class="table-showing" id="showingLabel">Showing results</span>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <div class="modal-backdrop" id="updateBackdrop" onclick="closeUpdateModal()"></div>
    <div class="modal-dialog" id="updateModal">
        <div class="modal-box">
            <div class="modal-header">
                <span class="modal-title">Update Report Progress</span>
                <button class="modal-close" onclick="closeUpdateModal()"><span class="material-symbols-outlined">close</span></button>
            </div>
            <div style="display:flex;flex-direction:column;gap:14px;">
                <div class="form-group">
                    <label class="form-label">Report Reference</label>
                    <input type="text" class="form-input" id="modalRef" readonly style="background:var(--gray-50);" />
                </div>
                <div class="form-group">
                    <label class="form-label">Update Status</label>
                    <select class="form-select" id="modalStatus">
                        <option value="">Select new status…</option>
                        <option value="In Progress">In Progress</option>
                        <option value="Resolved">Resolved</option>
                    </select>
                    <div id="modalCurrentStatus" style="font-size:12px;color:var(--gray-500);margin-top:6px;"></div>
                </div>
                <div class="form-group">
                    <label class="form-label">Progress Notes</label>
                    <textarea class="form-input" id="modalNote" maxlength="500" rows="3" placeholder="Describe the current progress..." style="height:auto;padding-top:10px;resize:vertical;"></textarea>
                </div>
            </div>
            <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:20px;">
                <button class="btn btn-secondary" onclick="closeUpdateModal()">Cancel</button>
                <button class="btn btn-primary" id="modalSaveBtn" onclick="confirmUpdate()">
                    <span class="material-symbols-outlined">save</span> Save Update
                </button>
            </div>
        </div>
    </div>

    <script src="/js/utils.js"></script>
    <script src="/js/app.js"></script>
    <script>
        let reportsData = [];
        let filtered = [];
        let loading = true;
        let loadError = null; // set when the API could not be reached

        // Offices may only move their reports along: Assigned → In Progress |
        // Resolved, In Progress → Resolved (the API enforces the same map).
        const OFFICE_NEXT = {
            'Assigned': ['In Progress', 'Resolved'],
            'In Progress': ['Resolved'],
        };
        let modalCurrent = '';
        const priorityClass = {
            'High': 'high',
            'Medium': 'medium',
            'Low': 'low'
        };
        const statusColors = {
            'In Progress': '#F97316',
            'Resolved': '#10B981',
            'Assigned': '#1A56DB'
        };
        const statusBg = {
            'In Progress': '#FFF7ED',
            'Resolved': '#ECFDF5',
            'Assigned': '#EFF6FF'
        };

        function render() {
            const tbody = document.getElementById('reportsBody');
            if (loading) {
                tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;padding:40px;color:var(--gray-400);">Loading reports…</td></tr>`;
                document.getElementById('showingLabel').textContent = 'Loading…';
                return;
            }
            if (loadError) {
                tbody.innerHTML = Utils.officeLoadErrorRow(8, loadError);
                document.getElementById('showingLabel').textContent = 'No results';
                return;
            }
            tbody.innerHTML = filtered.length ? filtered.map(r => `
    <tr>
      <td><img class="table-photo" src="${Utils.safeUrl(r.imageUrl || getPhotoUrl(r.photo || r.issue))}" onerror="this.style.background='var(--gray-200)';this.removeAttribute('src')" alt="${Utils.esc(r.issue)}" /></td>
      <td><span class="ref-id">${Utils.esc(r.ref)}</span></td>
      <td style="font-size:13px;font-weight:600;color:var(--gray-800);max-width:180px;">${Utils.esc(r.issue)}</td>
      <td style="font-size:13px;color:var(--gray-600);">${Utils.esc(r.barangay)}</td>
      <td><span class="priority-badge ${priorityClass[r.priority] || ''}">${Utils.esc(r.priority)}</span></td>
      <td><span style="display:inline-flex;align-items:center;padding:3px 10px;border-radius:var(--radius-full);font-size:11px;font-weight:600;background:${statusBg[r.status] || '#F3F4F6'};color:${statusColors[r.status] || '#6B7280'};">${Utils.esc(r.status)}</span></td>
      <td style="font-size:12px;color:var(--gray-500);">${Utils.esc(r.dateAssigned || r.date || '—')}</td>
      <td>
        <button class="btn-view" onclick="location.href=${Utils.jsArg('report-details.html?ref=' + encodeURIComponent(r.ref))}">
          <span class="material-symbols-outlined">visibility</span> View
        </button>
        ${OFFICE_NEXT[r.status] ? `<button class="btn-view" onclick="openUpdateModal(${Utils.jsArg(r.ref)}, ${Utils.jsArg(r.status)})">
          <span class="material-symbols-outlined">edit</span> Update
        </button>` : ''}
      </td>
    </tr>
  `).join('') : `<tr><td colspan="8" style="text-align:center;padding:40px;color:var(--gray-400);">No reports found</td></tr>`;
            document.getElementById('showingLabel').textContent = `Showing ${filtered.length} of ${reportsData.length} reports`;
        }

        function applyFilter() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            const st = document.getElementById('statusFilter').value;
            const pr = document.getElementById('priorityFilter').value;
            filtered = reportsData.filter(r =>
                (!q || (r.issue || '').toLowerCase().includes(q) || (r.ref || '').toLowerCase().includes(q) || (r.barangay || '').toLowerCase().includes(q)) &&
                (!st || r.status === st) &&
                (!pr || r.priority === pr)
            );
            render();
        }

        const doFilter = Utils.debounce(applyFilter, 250);
        document.getElementById('searchInput').addEventListener('input', doFilter);
        document.getElementById('statusFilter').addEventListener('change', applyFilter);
        document.getElementById('priorityFilter').addEventListener('change', applyFilter);

        function openUpdateModal(ref, status) {
            modalCurrent = status || '';
            const allowed = OFFICE_NEXT[modalCurrent] || [];
            const sel = document.getElementById('modalStatus');
            Array.from(sel.options).forEach(o => {
                if (o.value) o.disabled = allowed.indexOf(o.value) === -1;
            });
            sel.value = '';
            document.getElementById('modalRef').value = ref;
            document.getElementById('modalNote').value = '';
            document.getElementById('modalCurrentStatus').textContent = 'Current status: ' + (modalCurrent || '—');
            document.getElementById('updateBackdrop').classList.add('active');
            document.getElementById('updateModal').classList.add('active');
        }

        function closeUpdateModal() {
            document.getElementById('updateBackdrop').classList.remove('active');
            document.getElementById('updateModal').classList.remove('active');
        }

        // POST /api/admin/citizen-reports/{ref}/status — offices may only set
        // In Progress or Resolved on their own reports.
        async function confirmUpdate() {
            const ref = document.getElementById('modalRef').value;
            const status = document.getElementById('modalStatus').value;
            const note = document.getElementById('modalNote').value.trim();
            if (!status) return Utils.showToast('Select the new status first.', 'info');
            if ((OFFICE_NEXT[modalCurrent] || []).indexOf(status) === -1) {
                return Utils.showToast(`"${status}" is not an allowed next step from "${modalCurrent}".`, 'error');
            }
            const btn = document.getElementById('modalSaveBtn');
            btn.disabled = true;
            const json = await Api.action('POST', '/api/admin/citizen-reports/' + encodeURIComponent(ref) + '/status', {
                status: Utils.apiStatusValue(status),
                description: note || null,
            }, {
                loading: 'Updating status…',
                errorTitle: 'Status Update Failed',
            });
            btn.disabled = false;
            if (json && json.success) {
                closeUpdateModal();
                Utils.showToast('Status updated to ' + status + '.', 'success');
                load();
            }
        }

        render();

        // Load the office's real reports — no sample fallback.
        async function load() {
            const res = await Utils.fetchOfficeReports();
            reportsData = res.reports;
            loadError = res.live ? null : (res.error || 'Server unavailable.');
            if (!res.live) Utils.showToast('Could not load reports: ' + loadError, 'error');
            loading = false;
            applyFilter();
        }
        load();
    </script>
</body>

</html>
